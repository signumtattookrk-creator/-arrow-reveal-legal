<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found - Arrow Reveal: 3D Puzzle</title>
<link rel="icon" type="image/png" href="/arrow-reveal-legal/favicon.png">
<meta name="theme-color" content="#070b17">
<style>
:root{--bg:#070b17;--panel:#10182b;--panel2:#14213a;--text:#f7fbff;--muted:#a9b9d3;--cyan:#42d9ff;--gold:#ffc85c;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% -10%,#19335a 0,#070b17 46%,#050811 100%);color:var(--text);line-height:1.65}
.wrap{max-width:920px;margin:auto;padding:28px 22px 56px}
nav{display:flex;justify-content:space-between;align-items:center;gap:18px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.brand{font-weight:900;letter-spacing:.08em;color:var(--text);text-decoration:none}
nav .links{display:flex;gap:16px;flex-wrap:wrap;justify-content:flex-end}
nav .links a{color:var(--muted);text-decoration:none;font-size:14px}
nav .links a:hover{color:var(--cyan)}
.hero{padding:88px 0 58px;text-align:center}
.eyebrow{color:var(--cyan);font-size:12px;letter-spacing:.2em;font-weight:900}
h1{font-size:clamp(38px,8vw,72px);line-height:1;margin:16px 0 22px;letter-spacing:-.04em}
h2{font-size:24px;margin-top:38px;color:#fff}
h3{font-size:18px;margin-top:26px;color:#fff}
p,li{color:var(--muted)}
a{color:var(--cyan)}
.card{background:linear-gradient(145deg,rgba(20,33,58,.96),rgba(12,20,37,.96));border:1px solid var(--line);border-radius:20px;padding:24px;margin:18px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.badge{display:inline-block;border:1px solid rgba(66,217,255,.35);background:rgba(66,217,255,.08);color:#dff9ff;padding:9px 15px;border-radius:999px;font-size:13px}
.meta{color:var(--gold);font-weight:700}
footer{margin-top:48px;padding-top:24px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
address{font-style:normal;color:var(--muted)}
@media(max-width:720px){nav{align-items:flex-start}.grid{grid-template-columns:1fr}.hero{padding:62px 0 42px}nav .links{max-width:230px}}
h2[id]{scroll-margin-top:24px}
</style>
</head>
<body>
<main class="wrap">
<section class="hero">
<div class="eyebrow">ERROR 404</div>
<h1>Page not found</h1>
<p>This page does not exist. The pages below are always available:</p>
<p><a href="index.html">Home</a> &nbsp; <a href="support.html">Support</a> &nbsp; <a href="privacy.html">Privacy Policy</a> &nbsp; <a href="terms.html">Terms of Service</a></p>
</section>
</main>
</body>
</html>
